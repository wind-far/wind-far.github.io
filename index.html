<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="吕浩 · AI 产品经理 · 从真实问题出发，定义 AI 能力边界，把产品想法做成可体验、可验证的应用" />
    <meta name="theme-color" content="#f4f7f9" />
    <title>吕浩 · AI Product Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Kalam:wght@700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css?v=c4e8fd1a31" />
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div>

    <main class="site-shell" id="mainView" aria-hidden="true">
      <header class="os-header">
        <button class="os-mark" id="osMark" type="button"></button>
        <span class="os-context" id="osContext">ABOUT</span>
      </header>

      <div class="os-layout">
        <nav class="os-sidebar" id="sidebar" aria-label="网站主导航"></nav>

        <section class="main-window" aria-live="polite">
          <div id="titlebarHost"></div>
          <div class="workspace-stage" id="stage"></div>
        </section>
      </div>

      <footer class="terminal-strip" aria-label="系统状态">
        <span id="footerPrompt"></span>
        <span class="system-status"><i></i> SYSTEM READY</span>
      </footer>
    </main>

    <section class="terminal power-off" id="terminal" aria-label="lvhao OS 启动终端">
      <div class="terminal-titlebar">
        <span class="t-dot red"></span>
        <span class="t-dot yellow"></span>
        <span class="t-dot green"></span>
        <span class="t-title" id="termTitle"></span>
      </div>
      <div class="terminal-body boot-view" id="bootView">
        <div id="bootLines"></div>
      </div>
      <div class="boot-cta" id="bootCta">
        <button class="cta-text" id="ctaText" type="button">Press Enter to Launch</button>
        <span class="cta-arrow" aria-hidden="true">↓</span>
      </div>
    </section>

    <dialog id="projectPreview" class="project-preview" aria-labelledby="previewTitle"></dialog>

    <script src="assets/icons.js?v=4f15d904bc"></script>
    <script src="assets/content.js?v=c75cadd3b5"></script>
    <script src="assets/app.js?v=eb0f626584"></script>
  </body>
</html>
